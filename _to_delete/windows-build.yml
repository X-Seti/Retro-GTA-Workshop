# this belongs in root /.github/workflows/windows-build.yml - Version: 1
# X-Seti - October 26 2026 - Retro GTA Workshop - Windows exe build (PyInstaller)
name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['Retro_GTA_Workshop.exe', '_internal/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Keep line endings as-is
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      # App Settings System is a dependency (utils, themes, images).
      - name: Checkout App Settings System
        uses: actions/checkout@v4
        with:
          repository: X-Seti/App-Settings-System
          path: _app_settings

      - name: Add shared utils, themes, images
        run: |
          foreach ($d in 'utils', 'themes', 'images') {
            if (Test-Path apps/$d) { Remove-Item apps/$d -Recurse -Force }
            Copy-Item _app_settings/apps/$d apps/$d -Recurse
          }
          Remove-Item _app_settings -Recurse -Force

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Own bootloader (compiled here, not the stock prebuilt one) - stock
      # PyInstaller bootloaders are what Defender's ML heuristics flag.
      - name: PyInstaller with locally compiled bootloader
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: pip install --no-binary pyinstaller --no-cache-dir pyinstaller

      - name: Build exe
        run: pyinstaller --noconfirm retro_gta_workshop.spec

      - name: Import check
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -c "import sys; sys.path.insert(0, '.'); from PyQt6.QtWidgets import QApplication; app = QApplication(sys.argv); from apps.components.Retro_GTA_Workshop.retro_gta_workshop import RetroGTAWorkshop; w = RetroGTAWorkshop(None); print('RetroGTAWorkshop OK')"

      - uses: actions/upload-artifact@v4
        with:
          name: Retro_GTA_Workshop_Windows
          path: dist/Retro_GTA_Workshop

      - name: Add default settings
        run: if (Test-Path settings) { Copy-Item settings dist/Retro_GTA_Workshop/settings -Recurse -Force }
      - name: Add icons folder
        run: if (Test-Path icons) { Copy-Item icons dist/Retro_GTA_Workshop/icons -Recurse -Force }

      - name: Zip build
        run: Compress-Archive -Path dist/Retro_GTA_Workshop -DestinationPath Retro_GTA_Workshop_Windows.zip

      - name: Publish release windows-build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-build --cleanup-tag -y 2>$null
          $global:LASTEXITCODE = 0
          gh release create windows-build Retro_GTA_Workshop_Windows.zip --target $env:GITHUB_SHA --prerelease --title "Retro GTA Workshop Windows build" --notes "Latest main build. Unzip and run Retro_GTA_Workshop/Retro_GTA_Workshop.exe."

      - name: Commit exe to repo root
        run: |
          if (Test-Path _internal) { Remove-Item _internal -Recurse -Force }
          Copy-Item dist/Retro_GTA_Workshop/_internal _internal -Recurse
          Copy-Item dist/Retro_GTA_Workshop/Retro_GTA_Workshop.exe . -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A Retro_GTA_Workshop.exe _internal
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Windows exe build $($env:GITHUB_SHA.Substring(0,7)) [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          }
          $global:LASTEXITCODE = 0
